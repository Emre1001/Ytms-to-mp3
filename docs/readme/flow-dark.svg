<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 260" width="1340" height="260" role="img" aria-label="Ablauf: Link, Liste lesen, Ton laden, in MP3 umwandeln, fertig mit Tags, Cover und ZIP">
<style>
@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2')}
.num{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8f8d88;animation:numOn 4s infinite}
.tt{font:780 34px M,sans-serif;letter-spacing:-1px;fill:#f2f1ee}
.cap{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8f8d88}
.box{animation:boxOn 4s infinite}
.pulse{stroke-dasharray:3 10;stroke-dashoffset:13;opacity:0;animation:pulse 4s linear infinite}
@keyframes boxOn{0%,4%{stroke:rgba(255,248,235,.09)}10%,24%{stroke:#ff6a1f}34%,100%{stroke:rgba(255,248,235,.09)}}
@keyframes numOn{0%,4%{fill:#8f8d88}10%,24%{fill:#ff6a1f}34%,100%{fill:#8f8d88}}
@keyframes pulse{0%{stroke-dashoffset:13;opacity:1}14%{stroke-dashoffset:0;opacity:1}15%,100%{opacity:0}}
.n0 .box,.n0 .num{animation-delay:0.0s}.p0{animation-delay:0.4s}.n1 .box,.n1 .num{animation-delay:0.8s}.p1{animation-delay:1.2000000000000002s}.n2 .box,.n2 .num{animation-delay:1.6s}.p2{animation-delay:2.0s}.n3 .box,.n3 .num{animation-delay:2.4000000000000004s}.p3{animation-delay:2.8000000000000003s}.n4 .box,.n4 .num{animation-delay:3.2s}.p4{animation-delay:3.6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1340" height="260" rx="28" fill="#0b0b0c"/>
<line x1="250" y1="130" x2="288" y2="130" stroke="rgba(255,248,235,.09)" stroke-width="2"/><line class="pulse p0" x1="250" y1="130" x2="288" y2="130" stroke="#ff6a1f" stroke-width="2" pathLength="10"/><line x1="512" y1="130" x2="550" y2="130" stroke="rgba(255,248,235,.09)" stroke-width="2"/><line class="pulse p1" x1="512" y1="130" x2="550" y2="130" stroke="#ff6a1f" stroke-width="2" pathLength="10"/><line x1="774" y1="130" x2="812" y2="130" stroke="rgba(255,248,235,.09)" stroke-width="2"/><line class="pulse p2" x1="774" y1="130" x2="812" y2="130" stroke="#ff6a1f" stroke-width="2" pathLength="10"/><line x1="1036" y1="130" x2="1074" y2="130" stroke="rgba(255,248,235,.09)" stroke-width="2"/><line class="pulse p3" x1="1036" y1="130" x2="1074" y2="130" stroke="#ff6a1f" stroke-width="2" pathLength="10"/>

  <g class="n n0" transform="translate(32 60)">
    <rect class="box" width="212" height="140" rx="20" fill="#151517" stroke="rgba(255,248,235,.09)" stroke-width="1.5"/>
    <text x="22" y="40" class="num">01</text>
    <text x="22" y="88" class="tt">Link</text>
    <text x="22" y="116" class="cap">Playlist, Album, Song</text>
  </g>
  <g class="n n1" transform="translate(294 60)">
    <rect class="box" width="212" height="140" rx="20" fill="#151517" stroke="rgba(255,248,235,.09)" stroke-width="1.5"/>
    <text x="22" y="40" class="num">02</text>
    <text x="22" y="88" class="tt">Liste</text>
    <text x="22" y="116" class="cap">yt-dlp, kein Download</text>
  </g>
  <g class="n n2" transform="translate(556 60)">
    <rect class="box" width="212" height="140" rx="20" fill="#151517" stroke="rgba(255,248,235,.09)" stroke-width="1.5"/>
    <text x="22" y="40" class="num">03</text>
    <text x="22" y="88" class="tt">Ton</text>
    <text x="22" y="116" class="cap">bestaudio · Opus</text>
  </g>
  <g class="n n3" transform="translate(818 60)">
    <rect class="box" width="212" height="140" rx="20" fill="#151517" stroke="rgba(255,248,235,.09)" stroke-width="1.5"/>
    <text x="22" y="40" class="num">04</text>
    <text x="22" y="88" class="tt">MP3</text>
    <text x="22" y="116" class="cap">ffmpeg · 128–320k</text>
  </g>
  <g class="n n4" transform="translate(1080 60)">
    <rect class="box" width="212" height="140" rx="20" fill="#151517" stroke="rgba(255,248,235,.09)" stroke-width="1.5"/>
    <text x="22" y="40" class="num">05</text>
    <text x="22" y="88" class="tt">Fertig</text>
    <text x="22" y="116" class="cap">Tags · Cover · ZIP</text>
  </g>
</svg>
