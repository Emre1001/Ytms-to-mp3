<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Mona Sans";src:url(../static/fonts/mona-sans.woff2) format("woff2");font-weight:200 900;font-stretch:75% 125%}
html,body{margin:0;width:1200px;height:630px;background:#0b0b0c;color:#f2f1ee;font-family:"Mona Sans",sans-serif;overflow:hidden}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,248,235,.06) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,248,235,.06) 1px,transparent 1px) 0 0/40px 40px;-webkit-mask:radial-gradient(ellipse at 70% 50%,#000 20%,transparent 75%)}
.in{position:absolute;left:84px;top:84px;right:84px;bottom:84px;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-stretch:112%;font-size:30px}
.brand em{font-style:normal;color:#ff6a1f}
.mark{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;background:#ff6a1f}
