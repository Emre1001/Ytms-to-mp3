# Builds the installable apps on every push and pull request:
#   Windows  → YT-Music-MP3-windows-x64-Setup.exe
#   Linux    → YT-Music-MP3-linux-x86_64.AppImage, YT-Music-MP3-linux-amd64.deb
#   Android  → YT-Music-MP3-android-{arm64,armv7,x86_64}.apk
# Pushing a tag like v2.1.0 additionally publishes them as a GitHub release.
name: Apps bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QJS_URL: https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0

jobs:
  check:
    name: Syntax-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py packaging/desktop_server.py packaging/render_web.py
      - run: |
          node --check static/app.js
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check android/app/src/main/web/host.js

  ffmpeg:
    name: ffmpeg (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm ${{ matrix.target == 'windows' && 'mingw-w64' || '' }}
          packaging/ffmpeg/build.sh ${{ matrix.target }} out
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: out/

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: ffmpeg
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            ffmpeg: windows
            qjs: qjs-windows-x86_64.exe
            qjs_out: qjs.exe
            targets: --win nsis
          - name: Linux
            os: ubuntu-latest
            ffmpeg: linux
            qjs: qjs-linux-x86_64
            qjs_out: qjs
            targets: --linux AppImage deb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "${GITHUB_REF_NAME#v}" > VERSION; fi
          echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend (PyInstaller)
        run: |
          python -m pip install -r packaging/requirements-desktop.txt
          pyinstaller --noconfirm --distpath dist --workpath build packaging/ytmp3-server.spec
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.ffmpeg }}
          path: dist/bin
      - name: QuickJS
        run: |
          curl -fsSL -o "dist/bin/${{ matrix.qjs_out }}" "$QJS_URL/${{ matrix.qjs }}"
          chmod +x dist/bin/*
          ls -la dist/bin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Electron
        working-directory: desktop
        run: |
          npm ci
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder ${{ matrix.targets }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.ffmpeg }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "${GITHUB_REF_NAME#v}" > VERSION; fi
          echo "APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Web-Oberfläche einpacken
        run: |
          python -m pip install jinja2
          python packaging/render_web.py android/app/src/main/assets/www --prefix /static/ --inject android/app/src/main/web/host.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Signatur (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Kein ANDROID_KEYSTORE_BASE64-Secret – die APKs werden mit dem Debug-Schlüssel signiert."
          fi
      - name: APKs bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PappVersion="$APP_VERSION"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../out/YT-Music-MP3-android-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk ../out/YT-Music-MP3-android-armv7.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk ../out/YT-Music-MP3-android-x86_64.apk
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "YT Music → MP3 ${GITHUB_REF_NAME}" \
            --notes-file packaging/release-notes.md
