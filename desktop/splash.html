<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>YT Music MP3</title>
<style>
  :root{--bg:#f5f4f1;--fg:#141414;--muted:#6f6d68;--acc:#ff6a1f;color-scheme:light dark}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0f10;--fg:#f2f2f0;--muted:#8d8c88}}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-app-region:drag;user-select:none}
  main{display:grid;justify-items:center;gap:18px;text-align:center;padding:24px;max-width:560px}
  svg{width:64px;height:72px;color:var(--acc);overflow:visible}
  .bars path{transform-box:fill-box;transform-origin:center;animation:lvl 1.1s cubic-bezier(.45,0,.55,1) infinite alternate}
  .bars path:nth-child(2){animation-delay:-.35s}.bars path:nth-child(3){animation-delay:-.7s}
  .bars path:nth-child(4){animation-delay:-.2s}.bars path:nth-child(5){animation-delay:-.55s}
  .chev{animation:drop 1.4s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes lvl{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
  @keyframes drop{0%,100%{transform:translateY(-6px);opacity:.35}50%{transform:none;opacity:1}}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
  p{margin:0;color:var(--muted)}
  pre{margin:0;max-height:180px;overflow:auto;text-align:left;white-space:pre-wrap;font:11.5px/1.45 ui-monospace,Consolas,monospace;color:var(--muted);background:color-mix(in oklab,var(--fg) 5%,transparent);padding:10px 12px;border-radius:10px;-webkit-app-region:no-drag;user-select:text}
  button{-webkit-app-region:no-drag;font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 18px;background:var(--acc);color:#170b04;cursor:pointer}
  .err .bars path,.err .chev{animation:none}
  [hidden]{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <svg viewBox="96 82 320 360" fill="none" stroke="currentColor" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <g class="bars"><path d="M140 192v52"/><path d="M198 148v140"/><path d="M256 106v226"/><path d="M314 148v140"/><path d="M372 192v52"/></g>
    <path class="chev" d="M194 366l62 52 62-52"/>
  </svg>
  <h1>YT Music MP3</h1>
  <p id="msg">Wird gestartet…</p>
  <pre id="detail" hidden></pre>
  <button id="retry" hidden>Neu starten</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const error = q.get('error');
  const hex = v => /^#[0-9a-f]{3,8}$/i.test(v || '') ? v : '';
  if (hex(q.get('bg'))) document.documentElement.style.setProperty('--bg', q.get('bg'));
  if (hex(q.get('fg'))) document.documentElement.style.setProperty('--fg', q.get('fg'));
  if (error) {
    document.body.classList.add('err');
    const [head, ...rest] = error.split('\n');
    document.getElementById('msg').textContent = head;
    const detail = rest.join('\n').trim();
    if (detail) { const d = document.getElementById('detail'); d.textContent = detail; d.hidden = false; }
    const b = document.getElementById('retry');
    b.hidden = false;
    b.onclick = () => { b.disabled = true; window.YTHost && window.YTHost.restart(); };
  }
</script>
</body>
</html>
